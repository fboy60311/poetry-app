  <line x1="540" y1="156" x2="840" y2="156" stroke="#d8c39a" stroke-width="1"/>
  <g font-size="17" fill="#3a2c18" text-anchor="middle" line-height="34">
    <text x="690" y="200">床前明月光，疑是地上霜。</text>
    <text x="690" y="236">举头望明月，低头思故乡。</text>
